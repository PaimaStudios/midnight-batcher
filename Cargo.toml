[package]
name = "midnight-batcher"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.17", features = ["native-tls"] }
futures = "0.3"
serde_json = "1.0"
url = "2.2"
hex = "0.4.3"
rand = { version = "^0.8.4", features = ["getrandom"] }
reqwest = { version = "0.11", features = ["json"] }
anyhow = "1.0.93"
serde = { version = "1.0.215", features = ["derive"] }
clap = "4.5.27"
rocket = { version = "0.5.1", features = ["json"] }
tracing = "0.1.41"
tracing-subscriber = "0.3.19"
rocket_cors = "0.6.0"
sha256 = "1.5.0"
deadpool-sqlite = "0.10.0"
rayon = "1.10.0"
bech32 = "0.11.0"
subxt = "0.44.0"
subxt-signer = "0.44.0"
bip32 = "0.5.3"

mn-ledger = { git = "https://github.com/midnightntwrk/midnight-ledger", package = "midnight-ledger", tag = "ledger-6.1.0-alpha.3" } # From feature/unshielded-ledger
ledger-storage = { git = "https://github.com/midnightntwrk/midnight-ledger", package = "midnight-storage", tag = "ledger-6.1.0-alpha.3", features = ["parity-db"] }
coin-structure = { git = "https://github.com/midnightntwrk/midnight-ledger", package = "midnight-coin-structure", tag = "ledger-6.1.0-alpha.3" }
onchain-runtime = { git = "https://github.com/midnightntwrk/midnight-ledger", package = "midnight-onchain-runtime", tag = "ledger-6.1.0-alpha.3" }
base-crypto = { git = "https://github.com/midnightntwrk/midnight-ledger", package = "midnight-base-crypto", tag = "ledger-6.1.0-alpha.3" }
transient-crypto = { git = "https://github.com/midnightntwrk/midnight-ledger", package = "midnight-transient-crypto", tag = "ledger-6.1.0-alpha.3" }
zswap = { git = "https://github.com/midnightntwrk/midnight-ledger", package = "midnight-zswap", tag = "ledger-6.1.0-alpha.3" }
zkir = { git = "https://github.com/midnightntwrk/midnight-ledger", package = "zkir", tag = "ledger-6.1.0-alpha.3" }
midnight-serialize = { git = "https://github.com/midnightntwrk/midnight-ledger", package = "midnight-serialize", tag = "ledger-6.1.0-alpha.3" }


[dependencies.rusqlite]
version = "0.33.0"
features = ["bundled"]
