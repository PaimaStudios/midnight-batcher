services:
  proof-server:
    container_name: 'midnight-local-proof-server-0-12-0'
    image: 'midnightnetwork/proof-server:4.0.0'
    logging:
        # driver: none
        driver: local
    ports:
      - "6300:6300"
    environment:
      # RUST_BACKTRACE: "full"
      RUST_LOG: "error"
  # indexer:
  #   container_name: 'midnight-local-chain-indexer-0-12-0'
  #   image: 'midnightnetwork/midnight-chain-indexer:2.3.0'
  #   platform: linux/amd64
  #   ports:
  #     - '8088:8088'
  #   command: ['-Dlogback.configurationFile=logback-json-file.xml']
  #   environment:
  #     LOG_LEVEL: 'WARN'
  #     LEDGER_NETWORK_ID: 'Undeployed'
  #     SUBSTRATE_NODE_WS_URL: 'ws://node:9944'
  #     OTEL_JAVAAGENT_ENABLED: 'false'
  #   healthcheck:
  #     test: ['CMD', 'egrep', '"Block .* was stored at height 0"', '/tmp/app_logs/server.log']
  #     interval: 5s
  #     timeout: 5s
  #     retries: 30
  #   depends_on:
  #     node:
  #       condition: service_started
  #   volumes:
  #     - midnight-data-undeployed:/node
  node:
    image: 'midnightnetwork/midnight-node:0.12.0'
    platform: linux/amd64
    container_name: 'midnight-local-node-0-12-0'
    ports:
      - "9944:9944"
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9944/health" ]
      interval: 2s
      timeout: 5s
      retries: 5
      start_period: 40s
    environment:
      CFG_PRESET: "dev"
    volumes:
      - midnight-data-undeployed:/node

volumes:
  midnight-data-undeployed: {}
